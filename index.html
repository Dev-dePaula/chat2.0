<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ConnectChat — Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">C</div><div><b>ConnectChat</b><small>Comunicação em tempo real</small></div></div>
    <div class="user"><div class="avatar me">AP</div><div><b>Anderson</b><small>● Online</small></div><button>⋮</button></div>
    <nav>
      <button class="nav active" data-page="chat">💬 <span>Chat</span><em>3</em></button>
      <button class="nav" data-page="rooms">🎙 <span>Salas</span></button>
      <button class="nav" data-page="calendar">📅 <span>Agenda</span></button>
    </nav>
    <div class="side-title">CONVERSAS <button id="newChat">＋</button></div>
    <div id="contacts" class="contacts"></div>
    <div class="side-bottom">
      <button onclick="toast('Notificações abertas')">🔔 Notificações <i>3</i></button>
      <button onclick="toast('Configurações da demonstração')">⚙ Configurações</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div id="toast" class="toast"></div>

<div id="callModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" onclick="closeModal()">×</button>
    <div class="avatar big" id="callAvatar">JS</div>
    <h2 id="callTitle">Chamada de vídeo</h2>
    <p>Interface demonstrativa — pronta para futura integração com WebRTC/LiveKit.</p>
    <div class="video-box">WEBRTC / LIVEKIT<br><small>Área da chamada</small></div>
    <button class="danger" onclick="closeModal()">Encerrar chamada</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
